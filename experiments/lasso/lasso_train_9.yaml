experiment_name: "lasso_train_9"
random_seed: 42
backend: "numpy"
log_dir: "runs"
save_weights: true
weights_path: "weights/lasso"
tolerance: null

epochs: 280

dataset:
  path: "datasets/regression/bodyfat_scale.txt"
  precision: "float32" # float64 or float32
  batch_size: null # null为full batch

lasso_model:
  lam: 0.01
  sub_gradient: "off" # off, zero, random

optimizer:
  type: "optimizer.ProximalGradient"
  lr: 0.001
  nesterov: false

scheduler:
  type: "scheduler.LineSearch"
  c1: 0.0001
  c2: 0.9
  max_iter: 20
  fallback_lr: 0.0000000001



