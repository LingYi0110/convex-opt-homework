experiment_name: "logistic_l1_train_4"
random_seed: 42
backend: "numpy"
log_dir: "runs"
save_weights: true
weights_path: "weights/logistic_l1"

epochs: 500

dataset:
  path: "datasets/classification/a1a"
  precision: "float32" # float64 or float32
  batch_size: null # null为full batch

logistic_model:
  lam: 0.01
  norm: "l1" # l1, l2
  sub_gradient: "zero"

optimizer:
  type: "optimizer.GradientDescent"
  lr: 0.01

scheduler:
  type: "scheduler.CosineAnnealingLR"
  T_max: 500
  eta_min: 0.001


