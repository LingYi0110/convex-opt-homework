experiment_name: "logistic_l2_train_3"
random_seed: 42
backend: "numpy"
log_dir: "runs"
save_weights: true
weights_path: "weights/logistic_l2"

epochs: 500

dataset:
  path: "datasets/classification/a1a"
  precision: "float32" # float64 or float32
  batch_size: null # null为full batch

logistic_model:
  lam: 0.01
  norm: "l2" # l1, l2
  sub_gradient: "off"

optimizer:
  type: "optimizer.ProximalGradient"
  lr: 0.01
  nesterov: false

scheduler:
  type: "scheduler.BarzilaiBorwein"
  lr_type: "BB1"
  c1: 0.0001
  decay: 0.5
  memory_size: 5
  lr_min: 0.0000000001
  lr_max: 10000


