experiment_name: "logistic_train_1"
random_seed: 42
backend: "cupy"
log_dir: "runs"
save_weights: true
weights_path: "weights"

epochs: 50

dataset:
  path: "datasets/classification/german.numer_scale.txt"
  precision: "float32" # float64 or float32
  batch_size: null # null为full batch

logistic_model:
  lam: 0.01
  norm: "l1" # l1, l2
  sub_gradient: "off"

optimizer:
  type: "optimizer.ProximalGradient"
  lr: 0.1
  nesterov: true
  #momentum: 0.9

scheduler:
  type: "scheduler.CosineAnnealingLR"
  T_max: 50
  eta_min: 0.05


