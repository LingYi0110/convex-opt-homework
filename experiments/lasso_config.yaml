experiment_name: "lasso_train_1"
random_seed: 42
backend: "numpy"
log_dir: "runs"

epochs: 2000

dataset:
  path: "datasets/regression/abalone_scale.txt"
  precision: "float32" # float64 or float32
  batch_size: null # null为full batch

lasso_model:
  lam: 0.01
  sub_gradient: "off" # off, zero, random

# logistic_model:
#  lam: 0.01
#  norm: "l1" # l1, l2
#  sub_gradient: "off"

optimizer:
  type: "optimizer.ProximalGradient"
  lr: 0.001
  nesterov: true

scheduler:
  type: "scheduler.CosineAnnealingLR"
  T_max: 2000
  eta_min: 0.0001


