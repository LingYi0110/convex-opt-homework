experiment_name: "train_lasso_1"
random_seed: 42
backend: "numpy"
log_dir: "runs"
save_weights: true
weights_path: "weights"

epochs: 500

dataset:
  path: "datasets/regression/bodyfat_scale.txt"
  precision: "float32" # float64 or float32
  batch_size: null # null为full batch

lasso_model:
  lam: 0.01
  sub_gradient: "zero" # off, zero, random

optimizer:
  type: "optimizer.GradientDescent"
  lr: 0.001
  #nesterov: true

scheduler:
  type: "scheduler.CosineAnnealingLR"
  T_max: 500
  eta_min: 0.001


